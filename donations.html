<!doctype html>
<html lang="el">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Prize Pool | MDG</title>

  <link rel="stylesheet" href="assets/styles.css">
</head>


<body>


<main class="container section">

  <!-- PAGE TITLE -->

  <div class="donations-header">

    <h1>💰 Prize Pool</h1>

    <p class="muted">
      Ευχαριστούμε όλους όσους στηρίζουν το MDG και συμβάλλουν στο Prize Pool του Season 2.
    </p>

  </div>



  <!-- PRIZE POOL -->

  <section class="card donations-card">

    <div class="prize-pool-total">

      <span class="prize-pool-label">
        CURRENT PRIZE POOL
      </span>

      <span class="prize-pool-amount">
        TBA
      </span>

    </div>


    <!-- DONATIONS TABLE -->

    <div class="donations-table-wrapper">

      <table class="donations-table">

        <thead>

          <tr>
            <th>Donor</th>
            <th>Donation</th>
          </tr>

        </thead>


        <tbody>

          <tr>
            <td>Donor Name</td>
            <td>100,000 Gold</td>
          </tr>

          <tr>
            <td>Donor Name</td>
            <td>50,000 Gold</td>
          </tr>

          <tr>
            <td>Donor Name</td>
            <td>25,000 Gold</td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>


</main>



<footer>

  <div class="container">
    © 2026 MDG: Mythic Dungeon Greece
  </div>

</footer>



<script src="assets/app.js"></script>

<script>
  boot();
</script>


</body>

</html>
